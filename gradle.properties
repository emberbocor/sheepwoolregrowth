org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

java_version=17

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Forge. The jar also runs on NeoForge 1.20.1, which reports itself as forge 47.1.x.
# Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=47.1.0"
# Verify NeoForge with: ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.5"
# and: ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.106"
forge_version=47.4.28
forge_version_range=[47.1.0,)
forge_loader_version_range=[47,)

# Fabric. The jar is compiled against minecraft_version and declares fabric_minecraft_version_range. Fabric API is not needed.
# Check 1.20 and the minimum loader with: ./gradlew :fabric:compileJava "-Pminecraft_version=1.20" "-Pfabric_loader_version=0.14.21"
# and: ./gradlew :fabric:compileJava "-Pminecraft_version=1.20.1" "-Pfabric_loader_version=0.14.21"
fabric_loader_version=0.20.1
fabric_loader_version_range=>=0.14.21
fabric_minecraft_version_range=>=1.20 <=1.20.1
fabric_minecraft_label=1.20-1.20.1

mod_id=sheepwoolregrowth
mod_name=Sheep Wool Regrowth
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.sheepwoolregrowth
